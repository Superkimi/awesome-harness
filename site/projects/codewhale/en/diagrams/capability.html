ext><text class="node-sub" x="1100" y="164" text-anchor="middle">spec.rs:150</text><text class="node-note" x="1100" y="187" text-anchor="middle">Fleet 启动子进程时把“最多能写哪些地方”作为机器参数传进去</text></g><g class="diagram-node" data-label="MCP / Skills 插件被信任后文件仍可能变化，CodeWhale 不会只相信旧 receipt；真正启动和把能力展示给模型前还会再验。" data-detail="reviewed plugin stdio launch 会重算 staged manifest content/capability/file hashes，要求 cwd 在 staged root；remote endpoint 要与 reviewed origin 一致；catalog_is_current 在发布工具、prompt 或 resource 前再次校验 mutable source 与 CodeWhale-owned stage。" data-source="crates/tui/src/mcp.rs:641–695" data-href="https://github.com/Hmbown/CodeWhale/blob/b63e48331b7d06e0517970cd9b9033a4cbbe6fff/crates/tui/src/mcp.rs#L641-L695"><rect x="100" y="300" width="230" height="96" rx="9"/><text class="node-title" x="215" y="331" text-anchor="middle">MCP / Skills</text><text class="node-sub" x="215" y="354" text-anchor="middle">mcp.rs:641</text><text class="node-note" x="215" y="377" text-anchor="middle">插件被信任后文件仍可能变化，CodeWhale 不会只相信旧 r</text></g><g class="diagram-node" data-label="Sub-agents Fleet 不要求控制台知道 worker 是本机进程还是 SSH；它只消费统一的状态和 artifact 事件，状态页不会因为刷新而偷偷创建空 ledger。" data-detail="FleetHostAdapter 抽象 local process 与 SSH host，统一 start/read_status/read_logs/interrupt/restart/stop/cleanup，worker status 带 pid/exit/memory/retryable；fleet control 使用 workspace 下的 .codewhale/fleet.jsonl，CLI 与 TUI 复用同一 durable ledger/renderers，worker/artifact 行数有上限。" data-source="crates/tui/src/fleet/host.rs:1–5" data-href="https://github.com/Hmbown/CodeWhale/blob/b63e48331b7d06e0517970cd9b9033a4cbbe6fff/crates/tui/src/fleet/host.rs#L1-L5"><rect x="395" y="300" width="230" height="96" rx="9"/><text class="node-title" x="510" y="331" text-anchor="middle">Sub-agents</text><text class="node-sub" x="510" y="354" text-anchor="middle">host.rs:1</text><text class="node-note" x="510" y="377" text-anchor="middle">Fleet 不要求控制台知道 worker 是本机进程还是 SS</text></g><g class="diagram-node" data-label="Replay 父 Agent 已经显示完成，但后台 worker 还在花 token .querySelectorAll('.diagram-node')],detail=document.getElementById('detail'),link=document.getElementById('source-link');let base='0 0 1280 760',scale=1;function focus(n){nodes.forEach(x=>x.classList.remove('is-focus'));n?.classList.add('is-focus');if(n){detail.innerHTML='<b>'+n.dataset.label+'</b><br>'+n.dataset.detail+'<br><a href="'+n.dataset.href+'" target="_blank" rel="noreferrer">'+n.dataset.source+' ↗</a>';link.href=n.dataset.href}}nodes.forEach(n=>n.addEventListener('click',()=>focus(n)));document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();nodes.forEach(n=>n.style.opacity=!q||n.dataset.label.toLowerCase().includes(q)?'1':'.16')});document.querySelector('[data-zoom="in"]').addEventListener('click',()=>{scale=Math.max(.7,scale-.1);map.setAttribute('viewBox','0 0 '+1280*scale+' '+760*scale)});document.querySelector('[data-zoom="out"]').addEventListener('click',()=>{scale=Math.min(1.8,scale+.1);map.setAttribute('viewBox','0 0 '+1280*scale+' '+760*scale)});document.querySelector('[data-reset]').addEventListener('click',()=>{scale=1;map.setAttribute('viewBox',base);focus(null)});document.querySelector('[data-theme]').addEventListener('click',()=>root.dataset.theme=root.dataset.theme==='dark'?'light':'dark');</script></body></html>
