replaceable seam; orange = selected evidence</span><a id="source-link" href="https://github.com/chaitin/MonkeyCode/tree/fcc5320b15a10dfec4d5891ce44d9d1470e10c2b" target="_blank" rel="noreferrer">Open pinned source ↗</a></div><script>const root=document.documentElement,map=document.getElementById('map'),nodes=[...document.querySelectorAll('.diagram-node')],detail=document.getElementById('detail'),link=document.getElementById('source-link');let base='0 0 1500 690',scale=1;function focus(n){nodes.forEach(x=>x.classList.remove('is-focus'));n?.classList.add('is-focus');if(n){detail.innerHTML='<b>'+n.dataset.label+'</b><br>'+n.dataset.detail+'<br><a href="'+n.dataset.href+'" target="_blank" rel="noreferrer">'+n.dataset.source+' ↗</a>';link.href=n.dataset.href}}nodes.forEach(n=>n.addEventListener('click',()=>focus(n)));document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();nodes.forEach(n=>n.style.opacity=!q||n.dataset.label.toLowerCase().includes(q)?'1':'.16')});document.querySelector('[data-zoom="in"]').addEventListener('click',()=>{scale=Math.max(.7,scale-.1);map.setAttribute('viewBox','0 0 '+1500*scale+' '+690*scale)});document.querySelector('[data-zoom="out"]').addEventListener('click',()=>{scale=Math.min(1.8,scale+.1);map.setAttribute('viewBox','0 0 '+1500*scale+' '+690*scale)});document.querySelector('[data-reset]').addEventListener('click',()=>{scale=1;map.setAttribute('viewBox',base);focus(null)});document.querySelector('[data-theme]').addEventListener('click',()=>root.dataset.theme=root.dataset.theme==='dark'?'light':'dark');</script></body></html>
