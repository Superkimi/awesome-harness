mble prompt</text><text class="node-sub" x="355" y="294" text-anchor="middle">lib.rs:45</text><text class="node-note" x="355" y="317" text-anchor="middle">它不是在旧 Python 循环上继续打补丁，而是把一套 Code</text></g><g class="diagram-node" data-label="3. stream LLM 换了驾驶舱，压缩后的“交接便笺”也要换写法，否则目标模型会读不懂或丢失刚看过的文件。" data-detail="压缩先用当前 Harness 生成摘要请求，然后 build_harness_compacted_history：ZCode、Claude Code bare 等可走各自 replacement history；普通路径用 summary prefix。还会从 harness read 调用重建相关文件内容，并识别 no-truncate 标记。" data-source="codex-rs/core/src/compact.rs:299–389" data-href="https://github.com/openinterpreter/openinterpreter/blob/aaf0aebf8203559711df6ed25b265a3f096bd3ea/codex-rs/core/src/compact.rs#L299-L389"><rect x="465" y="240" width="190" height="96" rx="9"/><text class="node-title" x="560" y="271" text-anchor="middle">3. stream LLM</text><text class="node-sub" x="560" y="294" text-anchor="middle">compact.rs:299</text><text class="node-note" x="560" y="317" text-anchor="middle">换了驾驶舱，压缩后的“交接便笺”也要换写法，否则目标模型会读不懂</text></g><g class="diagram-node" data-label="4. schedule tools 多个搜索可以一起跑，但写文件或问用户会像闸门一样独占执行通道。" data-detail="ToolCallRuntime 查询 handler 是否支持并发；并发工具取得共享 read lock，写入/交互等排他工具取得 write lock，因此同组读工具可并行，任何排他工具会等待并阻塞后续组。" data-source="codex-rs/core/src/tools/parallel.rs:42–138" data-href="https://github.com/openinterpreter/openinterpreter/blob/aaf0aebf8203559711df6ed25b265a3f096bd3ea/codex-rs/core/src/tools/parallel.rs#L42-L138"><rect x="670" y="240" width="190" height="96" rx="9"/><text class="node-title" x="765" y="271" text-anchor="middle">4. schedule tools</text><text class="node-sub" x="765" y="294" text-anchor="middle">parallel.rs:42</text><text class="node-note" x="765" y="317" text-anchor="middle">多个搜索可以一起跑，但写文件或问用户会像闸门一样独占执行通道。</text></g><g class="diagram-node" data-label="5. enforce policy 它不是在旧 Python 循环上继续打补丁，而是把一套 Codex 级 Rust Harness 换了产品入口，再加入自己的多 Harness 能力。" data-detail="核心目录、crate、app-server 协议和 Python/TypeScript SDK 仍以 codex/openai-codex 命名；Open Interpreter 通过 Product::OpenInterpreter、interpreter/i 入口、.openinterpreter HOME 和 open-interpreter 包变体建立产品身份。" data-source="codex-rs/product-info/src/lib.rs:45–79" data-href="https://github.com/openinterpreter/openinterpreter/blob/aaf0aebf8203559711df6ed25b265a3f096bd3ea/codex-rs/product-info/src/lib.rs#L45-L79"><rect x="875" y="240" width="190" height="96" rx="9"/><text class="node-title" x="970" y="271" text-anchor="middle">5. enforce policy</text><text class="node-sub" x="970" y="294" text-anchor="middle">lib.rs:45</text><text class="node-note" x="970" y="317" text-anchor="middle">它不是在旧 Python 循环上继续打补丁，而是把一套 Code</text></g><g class="diagram-node" data-label="6. append events 默认会发产品使用事件到 Open Interpreter 的后端，用户可以在配置里关掉；遥测故障不会卡住编码任务。" data-detail="AnalyticsEventsClient 在 analytics_enabled != Some(false) 时创建队列；Open Interpreter 把任何 provider 的事件发送到 oi-new-api.fly.dev 的固定端点，配置 [analytics] enabled=false 可关闭；队列满会丢事件而不阻塞主循环。" data-source="codex-rs/analytics/src/client.rs:54–105" data-href="https://github.com/openinterpreter/openinterpreter/blob/aaf0aebf8203559711df6ed25b265a3f096bd3ea/codex-rs/analytics/src/client.rs#L54-L105"><rect x="1080" y="240" width="190" height="96" rx="9"/><text class="node-title" x="1175" y="271" text-anchor="middle">6. append events</text><text class="node-sub" x="1175" y="294" text-anchor="middle">client.rs:54</text><text class="node-note" x="1175" y="317" text-anchor="middle">默认会发产品使用事件到 Open Interpreter 的后端</text></g><g class="diagram-node" data-label="7. retry / compact 它最像“Coding Agent 兼容器”：同一套沙箱和会话底盘，让不同模型吃到熟悉的提示词与工具格式。" data-detail="本提交同时维护 15 类 Harness enum、三种 wire protocol、多个独立 request builder、数千行 alias/adapter 与 Harness-aware compaction，并以大量路由/快照/包测试约束行为。" data-source="codex-rs/core/src/harness/request.rs:75–231" data-href="https://github.com/openinterpreter/openinterpreter/blob/aaf0aebf8203559711df6ed25b265a3f096bd3ea/codex-rs/core/src/harness/request.rs#L75-L231"><rect x="1285" y="240" width="190" height="96" rx="9"/><text class="node-title" x="1380" y="271" text-anchor
