<!doctype html><html lang="zh-CN><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagram Design · 能力图</title><style>body{margin:0;background:#f5f4ed;color:#2d3142;font:14px system-ui,sans-serif;padding:28px}h1{font:400 36px Georgia,serif}svg{width:100%;min-width:780px;display:block}rect{fill:#fff;stroke:#2d3142;stroke-width:1.2}path{fill:none;stroke:#4f5d75;stroke-width:1.4}.diagram-node{cursor:pointer}.diagram-node:hover rect,.diagram-node.is-focus rect{fill:#f5ded3;stroke:#eb6c36}.diagram-node text{font-weight:600}.node-sub{font:10px monospace;fill:#4f5d75;font-weight:400!important}.legend{font:11px monospace;letter-spacing:.08em;color:#4f5d75}</style></head><body><p class="legend">CAPABILITY · SOURCE 840f944f08be</p><h1>Diagram Design · 能力图</h1><svg viewBox="0 0 900 420" role="img" aria-label="Diagram Design · 能力图"><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker></defs><rect width="100%" height="100%" fill="#f5f4ed" stroke="none"/><path d="M165 127 C225 127, 560 127, 620 127" marker-end="url(#arrow)"/><path d="M440 127 C500 127, 835 127, 895 127" marker-end="url(#arrow)"/><path d="M715 127 C775 127, 285 277, 345 277" marker-end="url(#arrow)"/><path d="M165 277 C225 277, 560 277, 620 277" marker-end="url(#arrow)"/><g class="diagram-node" data-node="0"><title>循环: 生成流程先问目的、读者和数据，再选 architecture/sequence/state/data-flow 等语法，最后跑 pre-output checklist。</title><rect x="70" y="92" width="190" height="70" rx="5"/><text x="165" y="124" text-anchor="middle">循环</text><text class="node-sub" x="165" y="143" text-anchor="middle">SKILL.md:1</text></g><g class="diagram-node" data-node="1"><title>上下文: 复杂度预算要求限制节点、层级、连接器和文字密度，必要时拆图，防止模型把所有内容塞进一张海报。</title><rect x="345" y="92" width="190" height="70" rx="5"/><text x="440" y="124" text-anchor="middle">上下文</text><text class="node-sub" x="440" y="143" text-anchor="middle">SKILL.md:1</text></g><g class="diagram-node" data-node="2"><title>安全: 安全/信任边界是被要求显式画出的语义模式，accessibility、对比度和可读性也在检查清单里。</title><rect x="620" y="92" width="190" height="70" rx="5"/><text x="715" y="124" text-anchor="middle">安全</text><text class="node-sub" x="715" y="143" text-anchor="middle">SKILL.md:1</text></g><g class="diagram-node" data-node="3"><title>扩展: </title><rect x="70" y="242" width="190" height="70" rx="5"/><text x="165" y="274" text-anchor="middle">扩展</text><text class="node-sub" x="165" y="293" text-anchor="middle">SKILL.md:6</text></g><g class="diagram-node" data-node="4"><title>协作: ownership、routing、escalation 等图形语义把团队协作关系画清楚，但不会代替实际的任务编排 runtime。</title><rect x="345" y="242" width="190" height="70" rx="5"/><text x="440" y="274" text-anchor="middle">协作</text><text class="node-sub" x="440" y="293" text-anchor="middle">SKILL.md:95</text></g></svg><p class="legend">点击节点突出显示；图中标签对应报告与章节中的源码证据。</p><script>document.querySelectorAll('.diagram-node').forEach(n=>n.addEventListener('click',()=>{document.querySelectorAll('.diagram-node').forEach(x=>x.classList.remove('is-focus'));n.classList.add('is-focus')}));</script></body></html>
